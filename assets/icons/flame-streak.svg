<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="flameOuter" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="flameInner" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="flameGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Outer flame -->
  <path d="M32 4C32 4 20 20 20 36C20 48 26 56 32 56C38 56 44 48 44 36C44 20 32 4 32 4ZM28 44C28 44 24 38 28 30C28 30 32 38 32 42C32 46 28 44 28 44ZM40 40C40 40 42 34 38 26C38 26 36 34 38 40C38 42 40 40 40 40Z" fill="url(#flameOuter)" filter="url(#flameGlow)"/>
  <!-- Inner flame -->
  <path d="M32 20C32 20 26 30 26 40C26 48 29 52 32 52C35 52 38 48 38 40C38 30 32 20 32 20Z" fill="url(#flameInner)" opacity="0.8"/>
  <!-- Hot core -->
  <ellipse cx="32" cy="46" rx="4" ry="6" fill="white"/>
  <!-- Sparks -->
  <circle cx="22" cy="16" r="1.5" fill="#FBBF24"/>
  <circle cx="42" cy="12" r="1" fill="#F97316"/>
  <circle cx="18" cy="24" r="1" fill="#FDE047"/>
</svg>

