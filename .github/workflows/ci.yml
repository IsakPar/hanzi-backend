# ══════════════════════════════════════════════════════════════════════════════
# CI Pipeline - Runs on every push and PR
# ══════════════════════════════════════════════════════════════════════════════
#
# Jobs run in PARALLEL:
#   1. lint_typecheck  - ESLint + TypeScript checking (~30s)
#   2. build_check     - Verify worker builds (~30s)
#   3. test_p0         - Critical path tests (~2-3 min)
#   4. test_p1         - Important feature tests (~2-3 min)
#   5. test_p2_p3      - Edge cases & future (~2-3 min)
#   6. test_unit       - Unit tests (~1-2 min)
#
# Total time: ~3-4 min (down from 10+ min sequential)
#
# ══════════════════════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Job 1: Lint & Type Check
  # ────────────────────────────────────────────────────────────────────────────
  lint_typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript check
        run: pnpm lint

  # ────────────────────────────────────────────────────────────────────────────
  # Job 2: Build Check
  # ────────────────────────────────────────────────────────────────────────────
  build_check:
    name: Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install wrangler
        run: pnpm add -g wrangler

      - name: Verify build
        run: wrangler deploy --dry-run --outdir=dist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # ────────────────────────────────────────────────────────────────────────────
  # Job 3: P0 Tests (Critical Path)
  # ────────────────────────────────────────────────────────────────────────────
  test_p0:
    name: P0 Critical Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run P0 tests
        run: pnpm test -- test/p0 --reporter=verbose
        env:
          JWT_SECRET: test-secret-for-ci-only-not-production

  # ────────────────────────────────────────────────────────────────────────────
  # Job 4: P1 Tests (Important Features)
  # ────────────────────────────────────────────────────────────────────────────
  test_p1:
    name: P1 Feature Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run P1 tests
        run: pnpm test -- test/p1 --reporter=verbose
        env:
          JWT_SECRET: test-secret-for-ci-only-not-production

  # ────────────────────────────────────────────────────────────────────────────
  # Job 5: P2/P3 Tests (Edge Cases & Future)
  # ────────────────────────────────────────────────────────────────────────────
  test_p2_p3:
    name: P2/P3 Edge & Future Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run P2/P3 tests
        run: pnpm test -- test/p2 test/p3 --reporter=verbose
        env:
          JWT_SECRET: test-secret-for-ci-only-not-production

  # ────────────────────────────────────────────────────────────────────────────
  # Job 6: Unit Tests
  # ────────────────────────────────────────────────────────────────────────────
  test_unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test -- test/unit --reporter=verbose
        env:
          JWT_SECRET: test-secret-for-ci-only-not-production

  # ────────────────────────────────────────────────────────────────────────────
  # Job 7: Remaining Tests (high/medium/low priority, smoke, etc.)
  # ────────────────────────────────────────────────────────────────────────────
  test_other:
    name: Other Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run other tests
        run: |
          # Run tests not in p0/p1/p2/p3/unit directories
          pnpm test -- test/high test/medium test/low test/smoke test/fixtures src/__tests__ --reporter=verbose --passWithNoTests
        env:
          JWT_SECRET: test-secret-for-ci-only-not-production

  # ────────────────────────────────────────────────────────────────────────────
  # Summary Job - Requires all jobs to pass
  # ────────────────────────────────────────────────────────────────────────────
  ci_success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint_typecheck, build_check, test_p0, test_p1, test_p2_p3, test_unit, test_other]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          echo "Job Results:"
          echo "  lint_typecheck: ${{ needs.lint_typecheck.result }}"
          echo "  build_check: ${{ needs.build_check.result }}"
          echo "  test_p0: ${{ needs.test_p0.result }}"
          echo "  test_p1: ${{ needs.test_p1.result }}"
          echo "  test_p2_p3: ${{ needs.test_p2_p3.result }}"
          echo "  test_unit: ${{ needs.test_unit.result }}"
          echo "  test_other: ${{ needs.test_other.result }}"
          
          FAILED=0
          
          if [[ "${{ needs.lint_typecheck.result }}" != "success" ]]; then
            echo "❌ Lint & Type Check failed"
            FAILED=1
          fi
          if [[ "${{ needs.build_check.result }}" != "success" ]]; then
            echo "❌ Build Check failed"
            FAILED=1
          fi
          if [[ "${{ needs.test_p0.result }}" != "success" ]]; then
            echo "❌ P0 Critical Tests failed"
            FAILED=1
          fi
          if [[ "${{ needs.test_p1.result }}" != "success" ]]; then
            echo "❌ P1 Feature Tests failed"
            FAILED=1
          fi
          if [[ "${{ needs.test_p2_p3.result }}" != "success" ]]; then
            echo "❌ P2/P3 Tests failed"
            FAILED=1
          fi
          if [[ "${{ needs.test_unit.result }}" != "success" ]]; then
            echo "❌ Unit Tests failed"
            FAILED=1
          fi
          if [[ "${{ needs.test_other.result }}" != "success" ]]; then
            echo "❌ Other Tests failed"
            FAILED=1
          fi
          
          if [[ $FAILED -eq 1 ]]; then
            exit 1
          fi
          
          echo "✅ All CI checks passed!"
