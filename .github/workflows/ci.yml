# ══════════════════════════════════════════════════════════════════════════════
# CI Pipeline - Runs on every push and PR
# ══════════════════════════════════════════════════════════════════════════════
#
# Jobs:
#   1. lint_typecheck  - ESLint + TypeScript checking (~30s)
#   2. test_unit       - Unit tests (~1-2 min)
#   3. test_integration - Integration tests (~2-3 min, PR/main only)
#   4. build_check     - Verify worker builds (~30s)
#
# ══════════════════════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Job 1: Lint & Type Check
  # ────────────────────────────────────────────────────────────────────────────
  lint_typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript check
        run: pnpm exec tsc --noEmit

  # ────────────────────────────────────────────────────────────────────────────
  # Job 2: Unit Tests
  # ────────────────────────────────────────────────────────────────────────────
  test_unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test -- --testPathPattern='unit|\.unit\.' --reporter=verbose
        env:
          JWT_SECRET: test-secret-for-ci-only-not-production

  # ────────────────────────────────────────────────────────────────────────────
  # Job 3: Integration Tests (PR and main only)
  # ────────────────────────────────────────────────────────────────────────────
  test_integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only run on PRs to main or pushes to main
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full test suite
        run: pnpm test
        env:
          JWT_SECRET: test-secret-for-ci-only-not-production

  # ────────────────────────────────────────────────────────────────────────────
  # Job 4: Build Check
  # ────────────────────────────────────────────────────────────────────────────
  build_check:
    name: Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install wrangler
        run: pnpm add -g wrangler

      - name: Verify build
        run: wrangler deploy --dry-run --outdir=dist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # ────────────────────────────────────────────────────────────────────────────
  # Summary Job - Requires all jobs to pass
  # ────────────────────────────────────────────────────────────────────────────
  ci_success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint_typecheck, test_unit, build_check]
    # Also require integration tests if they ran
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.lint_typecheck.result }}" != "success" ]]; then
            echo "❌ Lint & Type Check failed"
            exit 1
          fi
          if [[ "${{ needs.test_unit.result }}" != "success" ]]; then
            echo "❌ Unit Tests failed"
            exit 1
          fi
          if [[ "${{ needs.build_check.result }}" != "success" ]]; then
            echo "❌ Build Check failed"
            exit 1
          fi
          echo "✅ All CI checks passed!"

